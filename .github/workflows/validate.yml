name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installed-source:
    name: installed source (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    steps:
      # Archive identity must use the candidate head, not the PR merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare exact candidate archives and isolated Python
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          archives="$RUNNER_TEMP/installed-source-archives"
          mkdir "$archives"
          curl --fail --silent --show-error --location \
            "https://api.github.com/repos/$SOURCE_REPOSITORY/tarball/$SOURCE_SHA" \
            --output "$archives/source.tar.gz"
          curl --fail --silent --show-error --location \
            "https://api.github.com/repos/$SOURCE_REPOSITORY/zipball/$SOURCE_SHA" \
            --output "$archives/source.zip"
          python -m venv "$RUNNER_TEMP/installed-source-python"
          proof_python="$RUNNER_TEMP/installed-source-python/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            proof_python="$RUNNER_TEMP/installed-source-python/Scripts/python.exe"
          fi
          echo "PROOF_PYTHON=$proof_python" >> "$GITHUB_ENV"
          echo "PROOF_ARCHIVES=$archives" >> "$GITHUB_ENV"
      - name: Qualify installed helper without optional dependencies
        shell: bash
        run: '"$PROOF_PYTHON" -B scripts/installed-autoreview.test.py --archives "$PROOF_ARCHIVES" --extras absent'
      - name: Install pinned optional proof dependencies
        shell: bash
        run: '"$PROOF_PYTHON" -m pip install --only-binary=:all: Pillow==12.3.0 tomli==2.5.0'
      - name: Qualify real installed image decoder and TOML parser
        shell: bash
        run: '"$PROOF_PYTHON" -B scripts/installed-autoreview.test.py --archives "$PROOF_ARCHIVES" --extras present'

  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            group: all
            name: validate (ubuntu-latest)
          - os: windows-latest
            group: core
            name: validate (windows-latest, core)
          - os: windows-latest
            group: hardening-1
            name: validate (windows-latest, hardening-1)
          - os: windows-latest
            group: hardening-2
            name: validate (windows-latest, hardening-2)
          - os: windows-latest
            group: boundaries
            name: validate (windows-latest, boundaries)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install development typechecker
        run: npm ci --ignore-scripts
      - name: Check skills
        run: python scripts/check-skills --group ${{ matrix.group }}

  macos-sandbox:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install sandbox CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/autoreview-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.162.1
          echo "$RUNNER_TEMP/autoreview-codex/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Exercise native sandbox and Git boundaries without provider access
        run: |
          codex --version
          python -m unittest skills.autoreview.tests.test_codex_sandbox skills.autoreview.tests.test_git_boundary
